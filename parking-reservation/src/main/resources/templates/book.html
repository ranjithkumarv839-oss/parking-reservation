<!-- File: src/main/resources/templates/book.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Book Slot')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="auth-wrap">
    <div class="auth-card" style="width:450px;">
        <div class="stripe-top"></div>
        <div class="inner">
            <h2>Reserve <span th:text="${slot.slotNumber}"></span></h2>
            
            <!-- Location and pricing details -->
            <div class="sub" style="margin-bottom: 15px;">
                <span th:text="${slot.location}">Block A — Level 1</span>
            </div>
            
            <div style="background:#111; padding: 12px; border-radius: 4px; border:1px solid #333; margin-bottom: 20px; font-family:'IBM Plex Mono', monospace; font-size:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                    <span>Base Fare:</span>
                    <span th:text="'Rs. ' + ${slot.pricePerHour} + ' / hr'">Rs. 20 / hr</span>
                </div>
                <div style="display:flex; justify-content:space-between; color:var(--yellow); font-weight:bold;">
                    <span>Dynamic Pricing Fare:</span>
                    <span th:text="'Rs. ' + ${slot.currentPrice} + ' / hr'">Rs. 20 / hr</span>
                </div>
                <div th:if="${slot.evCharging}" style="color:var(--green); font-size:11px; margin-top:6px; display:flex; align-items:center; gap:4px;">
                    <span>⚡ EV charging fee premium included in price.</span>
                </div>
                <div th:if="${slot.disabilitySlot}" style="color:#3b82f6; font-size:11px; margin-top:6px; display:flex; align-items:center; gap:4px;">
                    <span>♿ Accessible / Priority reservation space.</span>
                </div>
            </div>

            <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-msg"></p>
            
            <form th:action="@{/reservations/book/{id}(id=${slot.id})}" method="post">
                <!-- Time Range selection -->
                <div class="field-group">
                    <label for="startTime">Start Time</label>
                    <input type="datetime-local" id="startTime" name="startTime" required>
                </div>
                <div class="field-group">
                    <label for="endTime">End Time</label>
                    <input type="datetime-local" id="endTime" name="endTime" required>
                </div>
                
                <!-- 4. License Plate Recognition / Vehicle Number Field -->
                <div class="field-group" style="position: relative;">
                    <label for="licensePlate">Vehicle Registration (License Plate)</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="licensePlate" name="licensePlate" placeholder="e.g. KA-03-MK-7382" style="text-transform: uppercase;" required>
                        <button type="button" class="btn btn-outline" onclick="simulateANPR()" style="padding: 10px 14px; font-size:11px; height: 43px; white-space: nowrap;">
                            Scan (Demo)
                        </button>
                    </div>
                    <span id="anpr-feedback" style="display:none; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--green); margin-top:4px;">
                        [DEMO LPR] Vehicle scanned successfully!
                    </span>
                </div>

                <!-- 2. Valet Parking Booking Option -->
                <div class="field-group" style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #333; padding-top: 15px; margin-top:15px;">
                    <input type="checkbox" id="needValet" name="needValet" style="accent-color:var(--yellow); width:18px; height:18px; cursor:pointer;">
                    <label for="needValet" style="margin-bottom:0; cursor:pointer; text-transform:none; font-size:13px; font-weight: normal; color: var(--chalk);">
                        Add Optional Valet Parking Service (+Rs. 50 flat)
                    </label>
                </div>

                <!-- 6. Disability / Accessibility Checkbox -->
                <div th:if="${slot.disabilitySlot}" class="field-group" style="background: rgba(59, 130, 246, 0.08); border: 1px dashed #3b82f6; padding: 12px; border-radius: 4px; display: flex; align-items: flex-start; gap: 10px; margin-top:15px;">
                    <input type="checkbox" id="disabilityConfirmed" name="disabilityConfirmed" style="accent-color:#3b82f6; width:18px; height:18px; cursor:pointer; margin-top:2px;" required>
                    <label for="disabilityConfirmed" style="margin-bottom:0; cursor:pointer; text-transform:none; font-size:12px; line-height: 1.4; color: var(--chalk); font-weight: normal;">
                        I confirm that I possess a valid disability parking permit / priority eligibility card to reserve this accessible slot.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; text-align:center; margin-top: 20px;">Confirm Booking</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Autofill current date times
    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        now.setMinutes(0); // align to hour
        
        const formatDateTime = (date) => {
            const pad = (n) => n.toString().padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        };
        
        const startInput = document.getElementById('startTime');
        const endInput = document.getElementById('endTime');
        
        startInput.value = formatDateTime(now);
        
        // default 2 hours
        const end = new Date(now.getTime() + 2 * 60 * 60 * 1000);
        endInput.value = formatDateTime(end);
    });

    // 4. ANPR License Plate Scan Simulation
    function simulateANPR() {
        const states = ['KA', 'MH', 'DL', 'HR', 'TS', 'TN', 'AP', 'UP'];
        const randomState = states[Math.floor(Math.random() * states.length)];
        const randomDistrict = Math.floor(Math.random() * 15).toString().padStart(2, '0');
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const randomSeries = chars[Math.floor(Math.random() * chars.length)] + chars[Math.floor(Math.random() * chars.length)];
        const randomNumber = Math.floor(Math.random() * 9000 + 1000).toString();
        
        const simulatedPlate = `${randomState}-${randomDistrict}-${randomSeries}-${randomNumber}`;
        
        const plateInput = document.getElementById('licensePlate');
        plateInput.value = simulatedPlate;
        
        const feedback = document.getElementById('anpr-feedback');
        feedback.style.display = 'block';
        setTimeout(() => {
            feedback.style.display = 'none';
        }, 4000);
    }
</script>
</body>
</html>
