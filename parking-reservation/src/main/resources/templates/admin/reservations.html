<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Reservations')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<style>
    .admin-res-head {
        display: grid;
        grid-template-columns: 80px 1.2fr 1fr 1.5fr 100px 90px 90px 100px;
        background: var(--concrete-light);
        padding: 12px 22px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--chalk-dim);
    }
    .admin-res-row {
        display: grid;
        grid-template-columns: 80px 1.2fr 1fr 1.5fr 100px 90px 90px 100px;
        padding: 14px 22px;
        align-items: center;
        border-top: 1px solid #1E1E22;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
    }
    @media (max-width: 992px) {
        .admin-res-head { display: none; }
        .admin-res-row { grid-template-columns: 1fr; row-gap: 6px; padding: 16px; }
    }
</style>

<div class="admin-wrap">
    <div class="admin-header" style="margin-bottom:20px;">
        <h2>Manage Bookings</h2>
    </div>

    <!-- Filters and Search Bar -->
    <div style="background:var(--concrete); border:1px solid #000; border-radius:6px; padding:20px; margin-bottom:24px;">
        <form th:action="@{/admin/reservations}" method="get" style="display:flex; flex-wrap:wrap; gap:16px; align-items:center;">
            <div style="flex:1; min-width:200px;">
                <label style="display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); text-transform:uppercase; margin-bottom:6px;">Search bookings</label>
                <input type="text" name="search" th:value="${search}" placeholder="Plate No, User Name, Slot..." style="width:100%; background:var(--asphalt); border:1px solid #444; color:var(--chalk); padding:10px 12px; border-radius:4px; font-size:13px; outline:none;">
            </div>
            
            <div style="width:150px;">
                <label style="display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); text-transform:uppercase; margin-bottom:6px;">Filter Status</label>
                <select name="status" style="width:100%; background:var(--asphalt); border:1px solid #444; color:var(--chalk); padding:10px 12px; border-radius:4px; font-size:13px;">
                    <option value="ALL" th:selected="${selectedStatus == 'ALL'}">All Status</option>
                    <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Active</option>
                    <option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">Completed</option>
                    <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Cancelled</option>
                </select>
            </div>

            <div style="width:150px;">
                <label style="display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); text-transform:uppercase; margin-bottom:6px;">Date Filter</label>
                <input type="date" name="date" th:value="${selectedDate}" style="width:100%; background:var(--asphalt); border:1px solid #444; color:var(--chalk); padding:9px 12px; border-radius:4px; font-size:13px; outline:none;">
            </div>

            <div style="margin-top:20px;">
                <button type="submit" class="btn btn-primary" style="padding:10px 20px; font-size:12px;">Apply Filter</button>
                <a th:href="@{/admin/reservations}" class="btn btn-outline" style="padding:10px 20px; font-size:12px; margin-left:8px;">Reset</a>
            </div>
        </form>
    </div>

    <!-- Booking details board -->
    <div class="admin-table-wrap" style="margin-bottom:40px;">
        <div class="admin-res-head">
            <span>ID</span>
            <span>User Details</span>
            <span>Plate No</span>
            <span>Slot & Window</span>
            <span>Est / Paid</span>
            <span>Overtime</span>
            <span>Status</span>
            <span>Actions</span>
        </div>

        <div class="admin-res-row" th:each="res : ${reservations}">
            <span style="font-weight:bold; color:var(--chalk-dim);" th:text="'#' + ${res.id}">#12</span>
            
            <div>
                <div style="font-weight:bold;" th:text="${res.user.name}">John Doe</div>
                <div style="font-size:10px; color:var(--chalk-dim);" th:text="${res.user.email}">john@email.com</div>
            </div>

            <span style="font-weight:bold; color:var(--yellow);" th:text="${res.licensePlate}">KA-03-MK-7382</span>

            <div>
                <div>
                    <span th:text="${res.slot.slotNumber}" style="font-weight:bold; color:var(--yellow);">A-12</span> · 
                    <span th:text="${res.slot.location}" style="font-size:11px; color:var(--chalk-dim);">Main Lot</span>
                </div>
                <div style="font-size:10px; color:var(--chalk-dim); margin-top:2px;"
                     th:text="|${#temporals.format(res.startTime,'dd MMM HH:mm')} - ${#temporals.format(res.endTime,'dd MMM HH:mm')}|">
                </div>
            </div>

            <div>
                <div th:text="'Est: Rs. ' + ${res.totalCost + (res.needValet ? 50 : 0)}" style="font-size:11px; color:var(--chalk-dim);">Est: Rs. 60</div>
                <div th:if="${res.status == 'COMPLETED'}" th:text="'Paid: Rs. ' + ${res.totalPaid}" style="font-weight:bold; color:var(--green);">Paid: Rs. 60</div>
            </div>

            <div>
                <span th:if="${res.overtimeCharge > 0}" th:text="'Rs. ' + ${res.overtimeCharge}" style="color:var(--red); font-weight:bold;">Rs. 40</span>
                <span th:if="${res.overtimeCharge == 0 || res.overtimeCharge == null}" style="color:#555;">N/A</span>
            </div>

            <div>
                <span th:if="${res.status == 'ACTIVE'}" class="status-pill available">ACTIVE</span>
                <span th:if="${res.status == 'COMPLETED'}" class="status-pill available" style="background:rgba(63,167,150,0.15); color:var(--green); border:1px solid var(--green);">COMPLETED</span>
                <span th:if="${res.status == 'CANCELLED'}" class="status-pill occupied">CANCELLED</span>
            </div>

            <div>
                <div th:if="${res.status == 'ACTIVE'}" style="display:flex; flex-direction:column; gap:6px;">
                    <form th:action="@{/admin/reservations/complete/{id}(id=${res.id})}" method="post">
                        <button type="submit" class="book-btn" style="background:var(--green); color:#fff; width:100%; border:none; padding:5px 8px; border-radius:3px; cursor:pointer; font-size:10px; text-transform:uppercase;">Complete</button>
                    </form>
                    <form th:action="@{/admin/reservations/cancel/{id}(id=${res.id})}" method="post">
                        <button type="submit" class="book-btn" style="background:var(--red); color:#fff; width:100%; border:none; padding:5px 8px; border-radius:3px; cursor:pointer; font-size:10px; text-transform:uppercase;">Cancel</button>
                    </form>
                </div>
                <span th:if="${res.status != 'ACTIVE'}" style="color:#555; font-size:11px;">Completed</span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(reservations)}">
            <p style="text-align:center; padding:20px; font-family:'IBM Plex Mono', monospace; font-size:13px; color:#888;">
                No bookings found matching filters.
            </p>
        </div>
    </div>
</div>
</body>
</html>
