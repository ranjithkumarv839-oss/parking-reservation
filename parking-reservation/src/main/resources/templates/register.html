<!-- File: src/main/resources/templates/register.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Register')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="stripe-top"></div>
        <div class="inner">
            <h2>Create an account</h2>
            <div class="sub">Book your first slot in under a minute.</div>
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-msg"></p>
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="field-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="Aditi Sharma" required>
                </div>
                <div class="field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="you@college.edu" required>
                </div>
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="••••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; text-align:center;">Register</button>
            </form>
            <div class="switch">Already have an account? <a th:href="@{/login}">Login here</a></div>
        </div>
    </div>
</div>
</body>
</html>
